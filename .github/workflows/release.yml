name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # gradle.properties pins a local JDK path; override it with the runner's JDK.
      - name: Build debug APK
        run: gradle -Dorg.gradle.java.home="$JAVA_HOME" assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "PartForge-${{ github.ref_name }}.apk"

      - uses: softprops/action-gh-release@v2
        with:
          files: PartForge-${{ github.ref_name }}.apk

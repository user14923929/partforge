name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Uses the committed Gradle wrapper; no separate Gradle install needed.
      - uses: gradle/actions/setup-gradle@v4

      # gradle.properties pins a local JDK path that does not exist on the runner.
      - name: Drop local JDK path
        run: sed -i '/^org.gradle.java.home=/d' gradle.properties

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "PartForge-${{ github.ref_name }}.apk"

      - uses: softprops/action-gh-release@v2
        with:
          files: PartForge-${{ github.ref_name }}.apk